<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA Icon Oluşturucu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    .upload-area {
      border: 2px dashed #ccc;
      padding: 40px;
      text-align: center;
      margin: 20px 0;
      border-radius: 8px;
    }
    input[type="file"] {
      margin: 20px 0;
    }
    canvas {
      display: none;
    }
    .preview {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 20px;
      margin: 20px 0;
    }
    .preview-item {
      text-align: center;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    .preview-item img {
      max-width: 100%;
      height: auto;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px 5px;
    }
    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <h1>PWA Icon Oluşturucu</h1>
  <p>512x512 piksel bir logo yükleyin, tüm boyutları otomatik oluşturalım.</p>
  
  <div class="upload-area">
    <input type="file" id="fileInput" accept="image/*">
    <p>veya</p>
    <p>512x512 piksel bir logo dosyası seçin</p>
  </div>

  <div id="preview" class="preview"></div>

  <div>
    <button onclick="downloadAll()">Tüm Icon'ları İndir</button>
    <button onclick="copyToClipboard()">Klasör Yolunu Kopyala</button>
  </div>

  <script>
    const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
    let images = {};

    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const preview = document.getElementById('preview');
          preview.innerHTML = '';
          
          sizes.forEach(size => {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Draw image centered and scaled
            ctx.drawImage(img, 0, 0, size, size);
            
            const dataUrl = canvas.toDataURL('image/png');
            images[size] = dataUrl;
            
            const previewItem = document.createElement('div');
            previewItem.className = 'preview-item';
            previewItem.innerHTML = `
              <img src="${dataUrl}" alt="${size}x${size}">
              <p>${size}x${size}</p>
            `;
            preview.appendChild(previewItem);
          });
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function downloadAll() {
      sizes.forEach(size => {
        const link = document.createElement('a');
        link.download = `icon-${size}x${size}.png`;
        link.href = images[size];
        link.click();
      });
      alert('Tüm icon\'lar indirildi! ui/public/icons/ klasörüne kopyalayın.');
    }

    function copyToClipboard() {
      navigator.clipboard.writeText('ui/public/icons/');
      alert('Klasör yolu kopyalandı: ui/public/icons/');
    }
  </script>
</body>
</html>
